name: CiderDarling binaries

# Builds the prebuilt runtime for every commit on main (tools/cider/package.py)
# and publishes it as the release bin-<first 12 hex digits>. Darling's bridges
# to host libraries name the build host's library versions, so there is one
# flavor per distribution family: arch (also the ciderdarling-bin AUR recipe)
# and ubuntu24.04. The AUR is updated only when the repository variable
# AUR_PUBLISH is "true" and the secret AUR_SSH_PRIVATE_KEY holds the
# maintainer's key.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (and the AUR recipe when enabled)
        type: boolean
        default: true
      replace:
        description: Overwrite the assets of an existing release for this commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ciderdarling-bin-${{ github.sha }}
  cancel-in-progress: false

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  source-fixtures:
    name: Source regressions (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang, gcc]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fixture dependencies
        run: |
          git submodule update --init --depth 1 src/external/libkqueue src/external/xnu src/external/cocotron src/external/libpthread src/external/libplatform src/external/metal src/external/objc4 src/external/cfnetwork src/external/iokitd src/external/security src/external/libunwind
          git -C src/external/metal submodule update --init --depth 1 deps/indium
      - name: Run source regressions
        env:
          CC: ${{ matrix.compiler }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc python3 libegl1-mesa-dev libgl-dev
          python3 tools/cider/prepare.py
          python3 validation/run.py
  build:
    name: Build (${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        flavor: [arch, ubuntu24.04]
    steps:
      # The source, its build tree and the Arch image need more than the
      # runner's free space; drop toolchains this build does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Check out CiderDarling
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ matrix.flavor }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.flavor }}-

      - name: Build in Arch Linux
        if: matrix.flavor == 'arch'
        run: |
          mkdir -p "$RUNNER_TEMP/ccache"
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP/ccache:/ccache" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e GIT_LFS_SKIP_SMUDGE=1 \
            archlinux:base-devel bash /src/tools/cider/ci/build-arch.sh

      - name: Build on Ubuntu 24.04
        if: matrix.flavor == 'ubuntu24.04'
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: bash tools/cider/ci/build-ubuntu.sh

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: ciderdarling-${{ matrix.flavor }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    needs: [build, source-fixtures]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create bin-${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE: ${{ inputs.replace || false }}
        run: bash tools/cider/ci/publish-release.sh dist

  aur:
    name: Update ciderdarling-bin on the AUR
    needs: release
    if: (github.event_name == 'push' || inputs.publish) && vars.AUR_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ciderdarling-arch
          path: dist
      - name: Push the recipe
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: bash tools/cider/ci/publish-aur.sh dist
